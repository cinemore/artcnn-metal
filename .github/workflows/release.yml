name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0"
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: swift test
      - name: Build, package and verify native and universal CLIs
        run: bun tools/release.ts "$RELEASE_TAG"
      - name: Publish release archives and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes
          dist/"$RELEASE_TAG"/*.tar.gz dist/"$RELEASE_TAG"/*.sha256 dist/"$RELEASE_TAG"/Formula/*.rb dist/"$RELEASE_TAG"/manifest.json
      - name: Check out shared Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v6.0.2
        with:
          repository: cinemore/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: .build/homebrew-tap
      - name: Update shared Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: bun tools/update-tap.ts "$RELEASE_TAG" .build/homebrew-tap
